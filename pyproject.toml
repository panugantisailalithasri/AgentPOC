[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deployment-verification-agent"
version = "0.1.0"
description = "POC Deployment Verification Agent: Phase 1 health, Phase 2 investigation, Phase 3 RCA"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.34.0",
  "requests>=2.31.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
dva = "deployment_verification.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
